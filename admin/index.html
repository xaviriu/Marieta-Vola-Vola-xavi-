<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Admin — Marieta Vola Vola</title>
  <link rel="icon" href="../images/web/mariquita.png" type="image/png" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="portal-body">

  <div class="login-page">
    <div class="login-card">
      <img src="../images/web/mariquita.png" alt="Marieta Vola Vola" class="login-card__logo" />
      <h1 class="login-card__title">Panel Admin</h1>
      <p class="login-card__subtitle">Gestiona alumnos, cursos y videos</p>

      <div class="alert alert--error" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">
          Entrar al panel
        </button>
      </form>

      <a href="../index.html" class="login-card__back">← Volver a la web</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    supabase.auth.getSession().then(async ({ data: { session } }) => {
      if (!session) return;
      const { data: profile } = await supabase
        .from('profiles').select('es_admin').eq('id', session.user.id).single();
      if (profile?.es_admin) window.location.href = 'dashboard.html';
    });

    const form      = document.getElementById('loginForm');
    const errorMsg  = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.textContent = 'Entrando...';
      submitBtn.disabled = true;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Email o contraseña incorrectos.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Entrar al panel';
        submitBtn.disabled = false;
        return;
      }

      const { data: profile } = await supabase
        .from('profiles').select('es_admin').eq('id', data.user.id).single();

      if (!profile?.es_admin) {
        await supabase.auth.signOut();
        errorMsg.textContent = 'Esta cuenta no tiene permisos de administrador.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Entrar al panel';
        submitBtn.disabled = false;
        return;
      }

      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
