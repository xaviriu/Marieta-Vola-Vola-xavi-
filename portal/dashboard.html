<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Cursos — Marieta Vola Vola</title>
  <link rel="icon" href="../images/web/comunidad-logo-256.png" type="image/png" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    [hidden] { display: none !important; }
    .portal-course-card.is-done { opacity: .55; filter: saturate(.6); transition: opacity .3s, filter .3s; }
    .portal-course-card.is-done:hover { opacity: 1; filter: none; }
    .pc-done { position: absolute; top: 12px; right: 12px; padding: 4px 12px; border-radius: 999px; background: var(--t699); color: #fff; font-weight: 700; font-size: 1rem; }
    .portal-course-card__image { position: relative; }
    .pc-bar { height: 10px; margin-top: 12px; border-radius: 999px; background: var(--crema-3); overflow: hidden; }
    .pc-bar span { display: block; height: 100%; border-radius: inherit; background: var(--t699); transition: width .6s var(--ease-out); }
  </style>
</head>
<body class="portal-body">

  <!-- NAVBAR -->
  <header class="portal-navbar">
    <a href="../index.html" class="portal-navbar__brand">
      <img src="../images/web/comunidad-logo.png" alt="Comunidad Marieta" class="portal-navbar__logo" />
      <span class="portal-navbar__name">Marieta Vola Vola</span>
    </a>
    <div class="portal-navbar__right">
      <span class="portal-navbar__user" id="userGreeting">Hola</span>
      <button class="portal-navbar__logout" id="passLink" type="button" hidden>Cambiar contraseña provisional</button>
      <button class="portal-navbar__logout" id="logoutBtn">Salir</button>
    </div>
  </header>

  <main class="portal-main">

    <div class="portal-header">
      <span class="label">Zona privada</span>
      <h1 class="portal-header__title" id="pageTitle">Mis cursos</h1>
      <p class="portal-header__sub" id="pageSubtitle">Aquí encontrarás los videos de los talleres en los que estás inscrita.</p>
    </div>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        Cargando tus cursos...
      </div>
    </div>

  </main>

  <dialog id="passDialog" aria-labelledby="passTitle" style="border:0;border-radius:16px;padding:28px;max-width:520px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div>
      <h2 id="passTitle" style="font-size:1.5rem;font-weight:800;margin-bottom:6px">Cambiar contraseña provisional</h2>
      <p style="margin-bottom:18px">Elige una contraseña que solo conozcas tú. No es obligatorio, pero te lo recomendamos.</p>
      <div class="alert alert--error" id="passError" role="alert"></div>
      <div class="alert alert--success" id="passOk" role="status"></div>
      <form id="passForm">
        <div class="form-field">
          <label for="curPass">Contraseña actual</label>
          <input type="password" id="curPass" required autocomplete="current-password" />
        </div>
        <div class="form-field">
          <label for="newPass1">Contraseña nueva (mínimo 8 caracteres)</label>
          <input type="password" id="newPass1" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-field">
          <label for="newPass2">Repite la contraseña nueva</label>
          <input type="password" id="newPass2" required minlength="8" autocomplete="new-password" />
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button type="submit" class="btn btn--primary btn--lg" id="passBtn">Guardar contraseña</button>
          <button type="button" class="btn btn--lg" id="passCancel" style="background:none;border:2px solid currentColor">Ahora no</button>
        </div>
      </form>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const COURSE_ICONS = ['needle', 'scissors', 'play', 'gift', 'box', 'needle'];
    const COURSE_IMG_CLASSES = ['', '--2', '--3'];

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const user = session.user;

      // Mostrar nombre
      const { data: profile } = await supabase
        .from('profiles')
        .select('nombre, es_admin')
        .eq('id', user.id)
        .single();

      if (profile?.es_admin) { window.location.href = '../admin/dashboard.html'; return; }

      // El botón solo aparece mientras no haya cambiado la contraseña provisional
      document.getElementById('passLink').hidden = !!user.user_metadata?.password_changed;

      const nombre = profile?.nombre || user.email.split('@')[0];
      const firstName = nombre.split(' ')[0];
      document.getElementById('userGreeting').textContent = `Hola, ${firstName}`;
      document.getElementById('pageTitle').textContent = `Aquí tienes tus cursos, ${firstName}`;
      document.getElementById('pageSubtitle').textContent = `Solo tú tienes acceso a este contenido. Aquí encontrarás los vídeos de los talleres en los que estás inscrita.`;

      // Cargar cursos matriculados
      const { data: matriculas, error } = await supabase
        .from('matriculas')
        .select('curso_id, cursos(id, nombre, descripcion, imagen_url)')
        .eq('user_id', user.id);

      const container = document.getElementById('content');

      if (error || !matriculas || matriculas.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="empty-state__icon"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#needle"></use></svg></span>
            <h2 class="empty-state__title">Aún no tienes cursos</h2>
            <p class="empty-state__text">
              Cuando reserves y pagues un taller, Marieta te dará acceso aquí.
              Escríbele por WhatsApp si tienes alguna duda.
            </p>
            <a href="https://wa.me/34630050209?text=Hola%20Marieta%21%20Me%20gustar%C3%ADa%20acceder%20a%20un%20curso."
               target="_blank" style="margin-top:24px" class="btn btn--primary">
              <svg class="icon" aria-hidden="true"><use href="../images/icons.svg#wa"></use></svg> Escribir a Marieta
            </a>
          </div>`;
        return;
      }

      const cursos = matriculas.map(m => m.cursos).filter(Boolean);

      // Contenidos de cada curso y lo que lleva hecho la alumna
      const cursoIds = cursos.map(c => c.id);
      const [{ data: bloques }, { data: hechos }, { data: terminados }] = await Promise.all([
        supabase.from('curso_bloques').select('id, curso_id').in('curso_id', cursoIds).in('tipo', ['video', 'archivo', 'enlace']),
        supabase.from('progreso_bloques').select('bloque_id').eq('user_id', user.id),
        supabase.from('progreso_cursos').select('curso_id').eq('user_id', user.id)
      ]);

      const hechosSet = new Set((hechos || []).map(h => h.bloque_id));
      const terminadosSet = new Set((terminados || []).map(t => t.curso_id));
      const countMap = {}, doneMap = {};
      (bloques || []).forEach(v => {
        countMap[v.curso_id] = (countMap[v.curso_id] || 0) + 1;
        if (hechosSet.has(v.id)) doneMap[v.curso_id] = (doneMap[v.curso_id] || 0) + 1;
      });

      // Los cursos terminados pasan al final, atenuados
      const info = cursos.map((c, i) => ({ c, i, fin: terminadosSet.has(c.id) }));
      info.sort((a, b) => (a.fin - b.fin) || (a.i - b.i));

      container.innerHTML = `<div class="portal-courses-grid">${
        info.map(({ c, i, fin }) => {
          const count = countMap[c.id] || 0;
          const done  = doneMap[c.id] || 0;
          const pct   = count ? Math.round(done / count * 100) : 0;
          const icon  = COURSE_ICONS[i % COURSE_ICONS.length];
          const imgClass = COURSE_IMG_CLASSES[i % COURSE_IMG_CLASSES.length];
          const progreso = fin
            ? 'Terminado'
            : (count ? `${done} de ${count} hechos` : 'Próximamente');
          return `
            <a href="curso.html?id=${encodeURIComponent(c.id)}" class="portal-course-card${fin ? ' is-done' : ''}">
              <div class="portal-course-card__image portal-course-card__image${imgClass}"${c.imagen_url ? ` style="background:url('${esc(c.imagen_url)}') center / cover no-repeat"` : ''}>
                ${c.imagen_url ? '' : `<div class="portal-course-card__image-label"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#${icon}"></use></svg></div>`}
                ${fin ? '<span class="pc-done">Terminado</span>' : ''}
              </div>
              <div class="portal-course-card__body">
                <h2 class="portal-course-card__title">${esc(c.nombre)}</h2>
                <p class="portal-course-card__desc">${esc(c.descripcion)}</p>
                <p class="portal-course-card__meta"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#play"></use></svg> ${progreso}</p>
                ${count ? `<div class="pc-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${fin ? 100 : pct}" aria-label="Progreso del curso"><span style="width:${fin ? 100 : pct}%"></span></div>` : ''}
              </div>
              <div class="portal-course-card__arrow">
                <span>${fin ? 'Volver a verlo' : (done ? 'Seguir con el curso' : 'Ver el curso')}</span>
                <span>→</span>
              </div>
            </a>`;
        }).join('')
      }</div>`;
    }

    const passLink   = document.getElementById('passLink');
    const passDialog = document.getElementById('passDialog');
    passLink.addEventListener('click', () => {
      passError.classList.remove('visible');
      passOk.classList.remove('visible');
      passDialog.showModal();
    });
    document.getElementById('passCancel').addEventListener('click', () => passDialog.close());

    const passForm  = document.getElementById('passForm');
    const passError = document.getElementById('passError');
    const passOk    = document.getElementById('passOk');
    const passBtn   = document.getElementById('passBtn');

    passForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      passError.classList.remove('visible');
      passOk.classList.remove('visible');
      const cur = document.getElementById('curPass').value;
      const p1  = document.getElementById('newPass1').value;
      const p2  = document.getElementById('newPass2').value;

      const fail = (msg) => { passError.textContent = msg; passError.classList.add('visible'); };
      if (p1.length < 8) return fail('La contraseña nueva debe tener al menos 8 caracteres.');
      if (p1 !== p2)     return fail('Las dos contraseñas nuevas no coinciden.');
      if (p1 === cur)    return fail('La contraseña nueva debe ser distinta de la actual.');

      passBtn.disabled = true;
      passBtn.textContent = 'Guardando...';
      try {
        // Se vuelve a pedir la contraseña actual: así nadie puede cambiarla desde un móvil o PC que se haya dejado abierto
        const { data: { user } } = await supabase.auth.getUser();
        const { error: authErr } = await supabase.auth.signInWithPassword({ email: user.email, password: cur });
        if (authErr) return fail('La contraseña actual no es correcta.');

        const { error } = await supabase.auth.updateUser({ password: p1, data: { password_changed: true } });
        if (error) return fail('No se ha podido guardar: ' + error.message);

        passForm.reset();
        passOk.textContent = '¡Listo! Tu contraseña se ha cambiado. Desde ahora entra con la nueva.';
        passOk.classList.add('visible');
        passLink.hidden = true;
        setTimeout(() => passDialog.close(), 2500);
      } finally {
        passBtn.disabled = false;
        passBtn.textContent = 'Guardar contraseña';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
