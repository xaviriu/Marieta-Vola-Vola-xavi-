<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curso — Marieta Vola Vola</title>
  <link rel="icon" href="../images/web/mariquita.png" type="image/png" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="portal-body">

  <!-- NAVBAR -->
  <header class="portal-navbar">
    <a href="../index.html" class="portal-navbar__brand">
      <img src="../images/web/mariquita.png" alt="Logo" class="portal-navbar__logo" />
      <span class="portal-navbar__name">Marieta Vola Vola</span>
    </a>
    <div class="portal-navbar__right">
      <span class="portal-navbar__user" id="userGreeting"></span>
      <button class="portal-navbar__logout" id="logoutBtn">Salir</button>
    </div>
  </header>

  <main style="padding: 32px 24px 80px; max-width: 1300px; margin: 0 auto;">

    <a href="dashboard.html" class="course-back">← Mis cursos</a>
    <h1 id="courseTitle" style="font-family:var(--display); font-size:clamp(1.8rem,4vw,2.8rem); font-weight:600; color:var(--texto); margin-bottom:32px;"></h1>

    <div id="content">
      <div class="loading"><div class="spinner"></div>Cargando...</div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = (u) => /^https:\/\//i.test(u || '') ? esc(u) : '#';

    function getYoutubeId(url) {
      const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
    }

    let videos = [];
    let currentIndex = 0;

    function renderPlayer(index) {
      const v = videos[index];
      const ytId = getYoutubeId(v.youtube_url);
      const playerEl = document.getElementById('playerArea');

      if (ytId) {
        playerEl.innerHTML = `
          <div class="course-player__video-wrap">
            <iframe src="https://www.youtube.com/embed/${ytId}?rel=0&modestbranding=1&color=white"
              allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
          </div>
          <h2 class="course-player__title">${esc(v.titulo)}</h2>
          ${v.descripcion ? `<p class="course-player__desc">${esc(v.descripcion)}</p>` : ''}`;
      } else {
        playerEl.innerHTML = `<div class="course-player__empty"><div class="course-player__empty-inner"><span><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#close"></use></svg></span>URL de video no válida</div></div>`;
      }

      // Actualizar lista activa
      document.querySelectorAll('.video-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      currentIndex = index;
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const user = session.user;
      const { data: profile } = await supabase
        .from('profiles')
        .select('nombre, es_admin')
        .eq('id', user.id)
        .single();

      if (profile?.es_admin) { window.location.href = '../admin/dashboard.html'; return; }
      document.getElementById('userGreeting').textContent = profile?.nombre?.split(' ')[0] || '';

      // Leer curso ID de la URL
      const params = new URLSearchParams(window.location.search);
      const cursoId = params.get('id');
      if (!cursoId) { window.location.href = 'dashboard.html'; return; }

      // Verificar que el alumno tiene matrícula en este curso
      const { data: matricula } = await supabase
        .from('matriculas')
        .select('id')
        .eq('user_id', user.id)
        .eq('curso_id', cursoId)
        .single();

      if (!matricula) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <span class="empty-state__icon"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#lock"></use></svg></span>
            <h2 class="empty-state__title">Sin acceso</h2>
            <p class="empty-state__text">No tienes acceso a este curso. Contacta con Marieta si crees que es un error.</p>
          </div>`;
        return;
      }

      // Cargar datos del curso
      const { data: curso } = await supabase
        .from('cursos')
        .select('nombre, descripcion')
        .eq('id', cursoId)
        .single();

      document.getElementById('courseTitle').textContent = curso?.nombre || 'Curso';
      document.title = `${curso?.nombre || 'Curso'} — Marieta Vola Vola`;

      // Cargar videos
      const { data: videoData } = await supabase
        .from('videos')
        .select('*')
        .eq('curso_id', cursoId)
        .order('orden', { ascending: true })
        .order('created_at', { ascending: true });

      videos = videoData || [];

      // Cargar materiales descargables
      const { data: materiales } = await supabase
        .from('materiales')
        .select('*')
        .eq('curso_id', cursoId)
        .order('created_at', { ascending: true });

      if (materiales && materiales.length > 0) {
        const materialesHtml = materiales.map(m => `
          <a href="${safeUrl(m.archivo_url)}" rel="noopener" target="_blank" download
            style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--crema-2);border:1px solid var(--rosa);border-radius:10px;text-decoration:none;color:var(--texto);transition:background 0.2s;"
            onmouseover="this.style.background='var(--rosa-cl)'" onmouseout="this.style.background='var(--crema-2)'">
            <span style="font-size:2rem;">${m.tipo === 'pdf' ? 'PDF' : 'Imagen'}</span>
            <div style="flex:1;">
              <div style="font-weight:700;font-size:0.95rem;">${esc(m.nombre)}</div>
              <div style="font-size:0.8rem;color:var(--texto-suave);margin-top:2px;">${m.tipo === 'pdf' ? 'PDF descargable' : 'Imagen descargable'}</div>
            </div>
            <span style="font-size:0.85rem;font-weight:700;color:var(--tierra);background:var(--rosa-cl);border:1px solid var(--rosa);padding:6px 14px;border-radius:20px;">⬇ Descargar</span>
          </a>`).join('');

        const materialesSection = document.createElement('div');
        materialesSection.style.cssText = 'margin-top:48px;';
        materialesSection.innerHTML = `
          <h2 style="font-family:var(--display);font-size:1.6rem;font-weight:600;color:var(--texto);margin-bottom:16px;">Materiales del curso</h2>
          <div style="display:flex;flex-direction:column;gap:12px;">${materialesHtml}</div>`;
        document.querySelector('main').appendChild(materialesSection);
      }

      const content = document.getElementById('content');

      if (videos.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <span class="empty-state__icon"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#play"></use></svg></span>
            <h2 class="empty-state__title">Próximamente</h2>
            <p class="empty-state__text">
              Marieta aún no ha subido videos para este curso. Vuelve pronto —
              recibirás aviso cuando haya contenido nuevo.
            </p>
          </div>`;
        return;
      }

      const listItems = videos.map((v, i) => {
        const ytId = getYoutubeId(v.youtube_url);
        const thumb = ytId
          ? `<img src="https://img.youtube.com/vi/${ytId}/mqdefault.jpg" class="video-item__thumb" alt="" />`
          : `<div class="video-item__thumb" style="display:flex;align-items:center;justify-content:center;font-size:1.4rem;"><svg class="icon" aria-hidden="true"><use href="../images/icons.svg#play"></use></svg></div>`;
        return `
          <div class="video-item ${i === 0 ? 'active' : ''}" data-index="${i}">
            ${thumb}
            <div class="video-item__info">
              <div class="video-item__title">${esc(v.titulo)}</div>
              <div class="video-item__date">${formatDate(v.created_at)}</div>
            </div>
            <div class="video-item__play">▶</div>
          </div>`;
      }).join('');

      content.innerHTML = `
        <div class="course-page">
          <div class="video-list">
            <div class="video-list__header">
              <div class="video-list__title">Contenido del curso</div>
              <div class="video-list__count">${videos.length} ${videos.length === 1 ? 'video' : 'videos'}</div>
            </div>
            ${listItems}
          </div>
          <div id="playerArea"></div>
        </div>`;

      // Renderizar primer video
      renderPlayer(0);

      // Click en video
      document.querySelectorAll('.video-item').forEach(el => {
        el.addEventListener('click', () => renderPlayer(parseInt(el.dataset.index)));
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });

    init();
  </script>
</body>
</html>
