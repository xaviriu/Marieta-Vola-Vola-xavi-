<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso alumnas — Marieta Vola Vola</title>
  <link rel="icon" href="../images/web/mariquita.png" type="image/png" />
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <style>[hidden] { display: none !important; }</style>
</head>
<body class="portal-body">

  <div class="login-page">

    <div class="login-card">
      <img src="../images/web/mariquita.png" alt="Comunidad Marieta" class="login-card__logo" />
      <h1 class="login-card__title">Comunidad Marieta</h1>
      <p class="login-card__subtitle">Accede a tus cursos de bordado</p>

      <div class="alert alert--error" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">
          Entrar
        </button>
      </form>

      <p style="text-align:center;margin-top:18px">
        <a href="#" id="forgotLink" style="font-size:1.0625rem;font-weight:700;text-decoration:underline">¿Has olvidado tu contraseña?</a>
      </p>

      <form id="resetForm" hidden style="margin-top:18px">
        <p style="margin-bottom:12px">Escribe tu email y te enviaremos un enlace para elegir una contraseña nueva.</p>
        <div class="alert alert--success" id="resetOk" role="status"></div>
        <div class="form-field">
          <label for="resetEmail">Tu email</label>
          <input type="email" id="resetEmail" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="resetBtn">Enviarme el enlace</button>
      </form>

      <a href="../index.html" class="login-card__back">← Volver a la web</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        checkAdminAndRedirect(session.user.id);
      }
    });

    async function checkAdminAndRedirect(userId) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('es_admin')
        .eq('id', userId)
        .single();
      const { data: { user } } = await supabase.auth.getUser();
      const esCristina = user?.email?.toLowerCase() === 'cristina@marietavolavola.com';
      window.location.href = (profile?.es_admin || esCristina)
        ? '../admin/dashboard.html'
        : 'dashboard.html';
    }

    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.textContent = 'Entrando...';
      submitBtn.disabled = true;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Email o contraseña incorrectos. Inténtalo de nuevo.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Entrar';
        submitBtn.disabled = false;
        return;
      }

      await checkAdminAndRedirect(data.user.id);
    });

    // Restablecer contraseña por email
    const resetForm = document.getElementById('resetForm');
    const resetOk   = document.getElementById('resetOk');
    const resetBtn  = document.getElementById('resetBtn');

    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      resetForm.hidden = !resetForm.hidden;
      if (!resetForm.hidden) {
        document.getElementById('resetEmail').value = document.getElementById('email').value;
        document.getElementById('resetEmail').focus();
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetBtn.disabled = true;
      resetBtn.textContent = 'Enviando...';
      const email = document.getElementById('resetEmail').value.trim();
      const redirectTo = new URL('restablecer.html', window.location.href).href;
      await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      // Mensaje siempre igual: no revela si el email existe o no
      resetOk.textContent = 'Si ese email está registrado, te hemos enviado un enlace. Mira también en spam. El enlace caduca en 1 hora.';
      resetOk.classList.add('visible');
      resetBtn.disabled = false;
      resetBtn.textContent = 'Enviarme el enlace';
    });
  </script>
</body>
</html>
