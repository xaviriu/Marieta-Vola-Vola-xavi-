<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Iniciar sesión — Marieta Vola Vola</title>
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#1F6B33" />
  <link rel="apple-touch-icon" href="../images/app/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Marieta" />
  <link rel="icon" href="../images/web/comunidad-logo-256.png" type="image/png" />
  <link rel="stylesheet" href="../css/fonts.css?v=20261019" />
  <link rel="stylesheet" href="../css/app.css?v=20261019" />
  <style>
    [hidden] { display: none !important; }
    .remember { display: flex; gap: 12px; align-items: flex-start; margin: 4px 0 20px; padding: 14px 16px; border: 2px solid var(--crema-3); border-radius: 12px; background: var(--crema); cursor: pointer; }
    .remember:hover { background: var(--crema-2); }
    .remember input { width: 24px; height: 24px; flex: none; margin-top: 2px; accent-color: #1F6B33; cursor: pointer; }
    .remember strong { display: block; font-size: 1.0625rem; }
    .remember small { display: block; margin-top: 2px; color: var(--texto-suave); font-size: .9375rem; line-height: 1.35; }
  </style>
</head>
<body class="portal-body">

  <div class="login-page">

    <div class="login-card">
      <img src="../images/web/comunidad-logo.png" alt="Comunidad Marieta" class="login-card__logo" />
      <h1 class="login-card__title">Iniciar sesión</h1>
      <p class="login-card__subtitle">Entra a tu zona privada de Comunidad Marieta</p>

      <div class="alert alert--error" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" checked />
          <span>
            <strong>Recordar este dispositivo</strong>
            <small>No tendrás que escribir la contraseña cada vez.</small>
          </span>
        </label>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">
          Iniciar sesión
        </button>
      </form>

      <p style="text-align:center;margin-top:18px">
        <a href="#" id="forgotLink" style="font-size:1.0625rem;font-weight:700;text-decoration:underline">¿Has olvidado tu contraseña?</a>
      </p>

      <form id="resetForm" hidden style="margin-top:18px">
        <p style="margin-bottom:12px">Escribe tu email y te enviaremos un enlace para elegir una contraseña nueva.</p>
        <div class="alert alert--success" id="resetOk" role="status"></div>
        <div class="form-field">
          <label for="resetEmail">Tu email</label>
          <input type="email" id="resetEmail" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="resetBtn">Enviarme el enlace</button>
      </form>

      <a href="../index.html" class="login-card__back">← Volver a la web</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=20261019"></script>
  <script>
    // Si ya hay sesión, redirigir
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        checkAdminAndRedirect(session.user.id);
      }
    });

    async function checkAdminAndRedirect(userId) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('es_admin')
        .eq('id', userId)
        .single();
      const { data: { user } } = await supabase.auth.getUser();
      const esCristina = user?.email?.toLowerCase() === 'cristina@marietavolavola.com';
      window.location.href = (profile?.es_admin || esCristina)
        ? '../admin/dashboard.html'
        : 'dashboard.html';
    }

    // Si el navegador tiene guardada una copia vieja de supabase-config.js,
    // estas funciones pueden no existir. En ese caso NO se rompe el login:
    // simplemente se entra como si fuera un dispositivo de confianza.
    const recuerda = (typeof window.mvvRecuerdaDispositivo === 'function')
      ? window.mvvRecuerdaDispositivo : function () { return true; };
    const recordar = (typeof window.mvvRecordarDispositivo === 'function')
      ? window.mvvRecordarDispositivo : function () {};

    // La casilla aparece como la dejó la última vez en este dispositivo
    try {
      document.getElementById('remember').checked = recuerda();
    } catch (e) { /* navegación privada: se queda marcada */ }

    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.textContent = 'Entrando...';
      submitBtn.disabled = true;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Decide dónde se guardará la sesión antes de crearla
      recordar(document.getElementById('remember').checked);

      let data, error;
      try {
        ({ data, error } = await supabase.auth.signInWithPassword({ email, password }));
      } catch (e) {
        error = e;
      }

      if (error) {
        errorMsg.textContent = (error.message && /fetch|network|NetworkError/i.test(error.message))
          ? 'No he podido conectar. Comprueba tu internet y vuelve a intentarlo.'
          : 'Email o contraseña incorrectos. Inténtalo de nuevo.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Iniciar sesión';
        submitBtn.disabled = false;
        return;
      }

      try {
        await checkAdminAndRedirect(data.user.id);
      } catch (e) {
        // Ha entrado bien pero algo ha fallado al mirar si es admin: a su zona
        window.location.href = 'dashboard.html';
      }
    });

    // Restablecer contraseña por email
    const resetForm = document.getElementById('resetForm');
    const resetOk   = document.getElementById('resetOk');
    const resetBtn  = document.getElementById('resetBtn');

    document.getElementById('forgotLink').addEventListener('click', (e) => {
      e.preventDefault();
      resetForm.hidden = !resetForm.hidden;
      if (!resetForm.hidden) {
        document.getElementById('resetEmail').value = document.getElementById('email').value;
        document.getElementById('resetEmail').focus();
      }
    });

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetBtn.disabled = true;
      resetBtn.textContent = 'Enviando...';
      const email = document.getElementById('resetEmail').value.trim();
      const redirectTo = new URL('restablecer.html', window.location.href).href;
      await supabase.auth.resetPasswordForEmail(email, { redirectTo });
      // Mensaje siempre igual: no revela si el email existe o no
      resetOk.textContent = 'Si ese email está registrado, te hemos enviado un enlace. Mira también en spam. El enlace caduca en 1 hora.';
      resetOk.classList.add('visible');
      resetBtn.disabled = false;
      resetBtn.textContent = 'Enviarme el enlace';
    });
  </script>
  <script src="../js/pwa.js?v=20261019" defer></script>
</body>
</html>
