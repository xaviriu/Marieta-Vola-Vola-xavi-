      <svg class="login-deco__svg" style="right:2%;bottom:10%;width:68px;--rot:-8deg" viewBox="0 0 90 82" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M8 42 Q8 8 30 4 Q52 8 52 42 Q52 60 30 64 Q8 60 8 42Z" fill="#D4B896" stroke="#B89060" stroke-width="2"/><circle cx="22" cy="22" r="2.5" fill="#B89060" opacity="0.7"/><circle cx="30" cy="18" r="2.5" fill="#B89060" opacity="0.7"/><circle cx="38" cy="22" r="2.5" fill="#B89060" opacity="0.7"/><circle cx="19" cy="32" r="2.5" fill="#B89060" opacity="0.7"/><circle cx="28" cy="28" r="2.5" fill="#B89060" opacity="0.7"/><circle cx="37" cy="30" r="2.5" fill="#B89060" opacity="0.7"/><ellipse cx="30" cy="58" rx="22" ry="6" fill="#C89020" stroke="#A07010" stroke-width="1.5"/>
      </svg>
    </div>

    <div class="login-card">
      <img src="../images/grupo-logo-extracted.jpg" alt="Comunidad Marieta" class="login-card__logo" />
      <h1 class="login-card__title">Comunidad Marieta</h1>
      <p class="login-card__subtitle">Accede a tus cursos de bordado</p>

      <div class="alert alert--error" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">
          Entrar
        </button>
      </form>

      <a href="../index.html" class="login-card__back">← Volver a la web</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        checkAdminAndRedirect(session.user.id);
      }
    });

    async function checkAdminAndRedirect(userId) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('es_admin')
        .eq('id', userId)
        .single();
      window.location.href = profile?.es_admin
        ? '../admin/dashboard.html'
        : 'dashboard.html';
    }

    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.textContent = 'Entrando...';
      submitBtn.disabled = true;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Email o contraseña incorrectos. Inténtalo de nuevo.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Entrar';
        submitBtn.disabled = false;
        return;
      }

      await checkAdminAndRedirect(data.user.id);
    });
  </script>
</body>
</html>
