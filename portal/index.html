<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Alumnos — Marieta Vola Vola</title>
  <link rel="icon" href="../images/logo.png" type="image/png" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/portal.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="portal-body">

  <div class="login-page">
    <div class="login-card">
      <img src="../images/logo.png" alt="Marieta Vola Vola" class="login-card__logo" />
      <h1 class="login-card__title">Zona privada</h1>
      <p class="login-card__subtitle">Accede a tus cursos de bordado</p>

      <div class="alert alert--error" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn">
          Entrar
        </button>
      </form>

      <a href="../index.html" class="login-card__back">← Volver a la web</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        checkAdminAndRedirect(session.user.id);
      }
    });

    async function checkAdminAndRedirect(userId) {
      const { data: profile } = await supabase
        .from('profiles')
        .select('es_admin')
        .eq('id', userId)
        .single();
      window.location.href = profile?.es_admin
        ? '../admin/dashboard.html'
        : 'dashboard.html';
    }

    const form     = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.textContent = 'Entrando...';
      submitBtn.disabled = true;

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = 'Email o contraseña incorrectos. Inténtalo de nuevo.';
        errorMsg.classList.add('visible');
        submitBtn.textContent = 'Entrar';
        submitBtn.disabled = false;
        return;
      }

      await checkAdminAndRedirect(data.user.id);
    });
  </script>
</body>
</html>
